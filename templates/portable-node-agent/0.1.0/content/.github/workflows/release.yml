name: Release signed OCI image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      EVIDENCE: ${{ github.workspace }}/release-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: push
        name: Build and push the immutable multi-architecture candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            OCI_CREATED=${{ steps.metadata.outputs.created }}
      - name: Set immutable reference
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "REF=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Gate linux/amd64 final image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REF }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Gate linux/arm64 final image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REF }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Generate linux/amd64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.REF }}
          format: spdx-json
          output-file: release-evidence/linux-amd64.spdx.json
          upload-artifact: false
      - name: Generate linux/arm64 SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.REF }}
          format: spdx-json
          output-file: release-evidence/linux-arm64.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign and attest the immutable digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          jq --null-input \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg builder "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{buildDefinition:{buildType:"https://hodosgraph.com/buildtypes/github-actions/docker/v1",externalParameters:{source:{repository:$repository,revision:$revision},image:{name:$image,digest:$digest}},resolvedDependencies:[{uri:("git+"+$repository+"@"+$revision),digest:{gitCommit:$revision}}]},runDetails:{builder:{id:$builder},metadata:{invocationId:$invocation}}}' \
            > "$EVIDENCE/slsa-provenance.json"
          cosign attest --yes --type slsaprovenance1 --predicate "$EVIDENCE/slsa-provenance.json" "$REF"
          for platform in linux-amd64 linux-arm64; do
            cosign attest --yes --type spdxjson --predicate "$EVIDENCE/$platform.spdx.json" "$REF"
          done
      - name: Verify the release identity and attestations
        env:
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" >/dev/null
          cosign verify-attestation --type slsaprovenance1 --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" >/dev/null
