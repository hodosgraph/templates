apiVersion: v1
kind: Service
metadata:
  name: {{ hodos.name }}
  labels:
    app.kubernetes.io/name: {{ hodos.name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/managed-by: hodosgraph
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ hodos.name }}
  ports:
    - name: mcp
      port: 8080
      targetPort: http
      protocol: TCP
